# Продакшен: Nginx + статический Vue, /api → FastAPI (имя сервиса `api` в Docker Compose).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # JSON заметки (PATCH /api/notes/...) может быть большим: сцена Excalidraw после импорта .excalidraw;
    # дефолт nginx 1m даёт HTTP 413. Вложения — до MAX_ATTACHMENT_BYTES в API (env).
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # явно для /api/, если переопределение в других include
        client_max_body_size 100m;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
