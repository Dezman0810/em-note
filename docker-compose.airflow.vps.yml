# Опционально на VPS: подключить Airflow к сети прод-стека em-note,
# чтобы в AIRFLOW_CONN_POSTGRES_EM_NOTE использовать хост db:5432 (как у API).
#
# Проверьте имя сети: docker network ls
# Обычно: em-note-prod_default (docker compose -p em-note-prod …) или em-note_default.
#
# Запуск:
#   docker compose -f docker-compose.airflow.yml -f docker-compose.airflow.vps.yml up -d --build
#
# В deploy/airflow/airflow.env:
#   AIRFLOW_CONN_POSTGRES_EM_NOTE=postgresql://postgres:ВАШ_ПАРОЛЬ@db:5432/note
#   EM_NOTE_ATTACHMENTS_VOLUME=em-note-prod_em_note_attachments
# (имена томов смотрите: docker volume ls)
#
# Том вложений монтируется в airflow-scheduler как /mnt/em_note_attachments (без docker run + alpine,
# что обходит лимиты Docker Hub). Опционально: EM_NOTE_ATTACHMENTS_MOUNT_PATH в airflow.env.

volumes:
  em_note_attachments_for_airflow:
    external: true
    name: ${EM_NOTE_ATTACHMENTS_VOLUME:-em-note-prod_em_note_attachments}

networks:
  em_note_prod:
    external: true
    name: ${EM_NOTE_DOCKER_NETWORK:-em-note-prod_default}

services:
  airflow-init:
    networks:
      - default
      - em_note_prod
  airflow-scheduler:
    networks:
      - default
      - em_note_prod
    volumes:
      - em_note_attachments_for_airflow:/mnt/em_note_attachments
    # На VPS с 2 ГБ Airflow — самый прожорливый сосед em-note: держим его в рамках.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  airflow-webserver:
    networks:
      - default
      - em_note_prod
    environment:
      # Один gunicorn-воркер: интерфейс Airflow открывают изредка, а каждый воркер — сотня мегабайт.
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: "1800"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
