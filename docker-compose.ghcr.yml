# Тот же прод-стек, но API и WEB берутся из GitHub Container Registry (уже собраны в CI).
# На VPS после первого логина в ghcr.io:
#   docker compose -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.ghcr.yml up -d
#
# Образы: ghcr.io/<владелец в нижнем регистре>/em-note-api:main и em-note-web:main
# Переопределение тега: IMAGE_TAG=sha-xxxx docker compose ...

name: em-note-prod

services:
  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-note}
    volumes:
      - em_note_pg_data:/var/lib/postgresql/data
    # VPS 1 CPU / 2 ГБ: дефолты Postgres рассчитаны на машину побольше.
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 15

  api:
    image: ghcr.io/${GHCR_OWNER:-dezman0810}/em-note-api:${IMAGE_TAG:-main}
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-note}
      ATTACHMENTS_DIR: /app/data/attachments
      FFMPEG_PATH: /usr/bin/ffmpeg
      # Распознавание речи выключено: модель Vosk занимала сотни мегабайт RAM и
      # ядро целиком во время работы. Записанное аудио по-прежнему хранится во вложениях.
      VOSK_ENABLED: "0"
      # Сжатие ответов берёт на себя Nginx в контейнере web (gzip в его конфиге).
      GZIP_JSON: "0"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Потолок, а не резерв: обычное потребление ~100 МБ, пик — распознавание аудио.
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "8000"
    volumes:
      - em_note_attachments:/app/data/attachments

  web:
    image: ghcr.io/${GHCR_OWNER:-dezman0810}/em-note-web:${IMAGE_TAG:-main}
    ports:
      - "${COMPOSE_WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Ежедневный бэкап базы и вложений в Dropbox (вместо Airflow, ~15 МБ вместо ~500 МБ).
  # Настройки и восстановление — deploy/backup/README.md.
  backup:
    build:
      context: ./deploy/backup
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-note}
      ATTACHMENTS_DIR: /mnt/attachments
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_TZ: ${BACKUP_TZ:-Europe/Moscow}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-0}
      BACKUP_ON_START: ${BACKUP_ON_START:-0}
      DROPBOX_REMOTE_ROOT: ${DROPBOX_REMOTE_ROOT:-/}
      DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN:-}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      DROPBOX_ACCESS_TOKEN: ${DROPBOX_ACCESS_TOKEN:-}
    volumes:
      # Запись нужна только команде restore; ежедневный бэкап каталог не трогает.
      - em_note_attachments:/mnt/attachments
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  em_note_pg_data:
  em_note_attachments:
